<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>嗅嗅 Bot 控制台</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root,
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --panel: #171a21;
        --panel2: #1e222b;
        --border: #2a2f3a;
        --text: #e6e9ef;
        --muted: #8b93a7;
        --accent: #4c8dff;
        --green: #3ddc84;
        --red: #ff5c5c;
        --yellow: #ffc857;
        --hover: #1c2029;
        --accent-hover: #3d7ce8;
        --btn-hover: #262b36;
        --log-bg: #0c0e13;
        --detail-bg: #141821;
        --detail-text: #b9c2d4;
        --badge-bg: #232834;
        --badge-fg: #a9b3c9;
        --badge-full-bg: #1d3050;
        --badge-full-fg: #8fbcff;
        --badge-at-bg: #33284a;
        --badge-at-fg: #c9a6ff;
        --log-t: #5c6478;
        --hit: #1b2333;
        --dot-off: #5a6072;
        --bar-grad: linear-gradient(180deg, #4c8dff, #2c5fb3);
        --err-bg: #2c1a1a;
        --err-bd: #5a2b2b;
        --err-fg: #ffb3b3;
        --ok-bg: #12291d;
        --ok-bd: #24503a;
        --ok-fg: #9ff0c0;
        --danger-bd: #4a2b2b;
        --danger-fg: #ff8f8f;
        --danger-hover: #2e1c1c;
      }
      :root[data-theme="light"] {
        --bg: #f4f6fa;
        --panel: #ffffff;
        --panel2: #eef1f7;
        --border: #d8dee9;
        --text: #1b2230;
        --muted: #667085;
        --accent: #2563eb;
        --green: #0f9d58;
        --red: #d92d20;
        --yellow: #b7791f;
        --hover: #eef2f9;
        --accent-hover: #1d4ed8;
        --btn-hover: #e3e9f3;
        --log-bg: #fbfcfe;
        --detail-bg: #f7f9fc;
        --detail-text: #3d4759;
        --badge-bg: #e8edf5;
        --badge-fg: #4a5568;
        --badge-full-bg: #dbe8ff;
        --badge-full-fg: #1d4ed8;
        --badge-at-bg: #ece2ff;
        --badge-at-fg: #6b34c9;
        --log-t: #98a2b3;
        --hit: #e3ecfb;
        --dot-off: #a9b1c1;
        --bar-grad: linear-gradient(180deg, #5b95ff, #2563eb);
        --err-bg: #fdeceb;
        --err-bd: #f3b6b1;
        --err-fg: #a8201a;
        --ok-bg: #e9f8ef;
        --ok-bd: #9fd9b6;
        --ok-fg: #0b6b3a;
        --danger-bd: #f0c2c2;
        --danger-fg: #c02b2b;
        --danger-hover: #fdeceb;
      }
      :root {
        --mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
      }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        font-size: 14px;
        transition:
          background 0.18s,
          color 0.18s;
      }
      /* ============================ 动效总开关 ============================
         所有动效都集中在下面这几个关键帧里，并在结尾用
         prefers-reduced-motion 统一关闭，方便整体调整。 */      :root {
        --lift: translateY(-3px);
        --glow: 0 12px 26px rgba(0, 0, 0, 0.34);
        --glow-soft: 0 8px 18px rgba(0, 0, 0, 0.22);
      }
      :root[data-theme="light"] {
        --glow: 0 12px 24px rgba(23, 43, 92, 0.14);
        --glow-soft: 0 7px 16px rgba(23, 43, 92, 0.1);
      }

      /* 数据变化时：数值跳动 + 底色泛光 */
      @keyframes numPop {
        0% {
          transform: translateY(0) scale(1);
        }
        38% {
          transform: translateY(-4px) scale(1.07);
          color: var(--accent);
        }
        100% {
          transform: translateY(0) scale(1);
        }
      }
      @keyframes softFlash {
        0% {
          box-shadow: 0 0 0 1px var(--accent),
            0 0 18px -6px var(--accent);
        }
        100% {
          box-shadow: 0 0 0 1px transparent, 0 0 0 0 transparent;
        }
      }
      /* 列表项：向上淡入（批量出现时按 order 错峰） */
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(9px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      /* 柱状图：长出来 */
      @keyframes barRise {
        from {
          transform: scaleY(0.08);
          opacity: 0.25;
        }
        to {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      /* 日志新行 */
      @keyframes lineSlide {
        from {
          opacity: 0;
          transform: translateX(-14px);
          background: var(--hit);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: transparent;
        }
      }
      /* 状态点：状态切换时扩散一圈 */
      @keyframes ripple {
        0% {
          opacity: 0.9;
          transform: scale(0.45);
        }
        100% {
          opacity: 0;
          transform: scale(2.9);
        }
      }
      /* 时间戳秒变动 */
      @keyframes tickPop {
        0% {
          opacity: 1;
        }
        30% {
          opacity: 0.25;
          transform: translateY(-1px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* 顶部扫光：每次刷新给页面一点"正在读取"的反馈 */
      @keyframes sweep {
        0% {
          background-position: -320px 0;
        }
        100% {
          background-position: 620px 0;
        }
      }

      .pop {
        animation: numPop 0.5s cubic-bezier(0.22, 0.9, 0.28, 1.3);
      }
      .flash {
        animation: softFlash 0.62s ease-out;
      }
      .stagger {
        animation: riseIn 0.4s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
      }
      .rise {
        animation: barRise 0.42s cubic-bezier(0.2, 0.9, 0.25, 1) backwards;
        transform-origin: bottom center;
      }
      .logline.new {
        animation: lineSlide 0.45s ease-out;
      }
      .logline.highlight {
        background: var(--hit);
        border-radius: 4px;
        box-shadow: inset 2px 0 0 var(--accent);
        transition: background 0.5s;
      }
      /* 文本类数据（状态、时间戳、分页信息）变化时轻轻跳一下 */
      .tick {
        display: inline-block;
        animation: tickPop 0.34s ease-out;
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid currentColor;
        opacity: 0;
        pointer-events: none;
      }
      .dot.ripple::after {
        animation: ripple 0.7s ease-out;
      }

      /* 顶部扫光：每次刷新（1 秒）有一道淡光从左上角掠过，暗示"正在读取"。
         时序交给 JS 的 stagger / replay 控制，这里只提供样式类。 */
      .wrap {
        position: relative;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }
      .wrap::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 260px;
        height: 2px;
        border-radius: 2px;
        pointer-events: none;
        opacity: 0;
        background: linear-gradient(
          90deg,
          transparent,
          color-mix(in srgb, var(--accent) 75%, transparent),
          transparent
        );
      }
      .wrap.sweep::before {
        opacity: 1;
        animation: sweep 0.75s ease-out;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 13px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 13px;
      }
      .dot {
        position: relative;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
        transition:
          background 0.25s,
          box-shadow 0.25s;
      }
      .dot.on {
        background: var(--green);
        box-shadow: 0 0 9px var(--green);
        animation: pulse 1.8s infinite;
      }
      .dot.off {
        background: var(--dot-off);
      }
      .dot.busy {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .uptime {
        color: var(--muted);
        font-size: 12px;
      }
      .spacer {
        flex: 1;
      }

      button {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
        padding: 8px 15px;
        transition: 0.15s;
      }
      button:hover:not(:disabled) {
        background: var(--btn-hover);
        border-color: var(--border);
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button.danger {
        border-color: var(--danger-bd);
        color: var(--danger-fg);
      }
      button.danger:hover:not(:disabled) {
        background: var(--danger-hover);
      }
      button.sm {
        padding: 5px 11px;
        font-size: 13px;
      }

      .controls {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 18px;
        transition:
          border-color 0.22s,
          box-shadow 0.22s;
      }
      .controls:hover {
        border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
        box-shadow: var(--glow-soft);
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
      }

      .banner {
        padding: 10px 14px;
        border-radius: 9px;
        margin-bottom: 16px;
        font-size: 13px;
        display: none;
      }
      .banner.err {
        display: block;
        background: var(--err-bg);
        border: 1px solid var(--err-bd);
        color: var(--err-fg);
      }
      .banner.ok {
        display: block;
        background: var(--ok-bg);
        border: 1px solid var(--ok-bd);
        color: var(--ok-fg);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
        gap: 13px;
        margin-bottom: 18px;
      }
      .card {
        position: relative;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 15px;
        /* 卡片内容左对齐：标签在上、数值在下 */
        text-align: left;
        transition:
          transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1),
          box-shadow 0.22s,
          border-color 0.22s,
          background 0.22s;
      }
      /* 悬停：整块浮起 + 顶部渐变高亮条 */
      .card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0;
        transform: scaleX(0.3);
        transition:
          opacity 0.25s,
          transform 0.35s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .card:hover {
        transform: var(--lift);
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
        box-shadow: var(--glow);
      }
      .card:hover::before {
        opacity: 1;
        transform: scaleX(1);
      }
      .card .value {
        font-size: 26px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
        will-change: transform;
        transition: color 0.3s;
      }
      .card:hover .value {
        color: var(--accent);
      }
      .card .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 7px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color 0.22s;
      }
      /* 标题前的 emoji 图标：悬停时轻微放大 */
      .card .label .ico {
        font-size: 13px;
        line-height: 1;
        filter: saturate(1.1);
        transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1);
      }
      .card:hover .label {
        color: var(--text);
      }
      .card:hover .label .ico {
        transform: scale(1.18);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 18px;
        transition:
          border-color 0.25s,
          box-shadow 0.25s,
          background 0.25s;
      }
      .panel:hover {
        border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
        box-shadow: var(--glow-soft);
      }
      .panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 13px;
        color: #c8cedd;
        transition: color 0.25s;
      }
      :root[data-theme="light"] .panel h2 {
        color: #2b3446;
      }
      /* 标题左侧的小竖条：悬停时点亮 */
      .panel h2::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 12px;
        border-radius: 2px;
        margin-right: 8px;
        vertical-align: -1px;
        background: var(--border);
        transition:
          background 0.25s,
          transform 0.25s;
      }
      .panel:hover h2 {
        color: var(--text);
      }
      .panel:hover h2::before {
        background: var(--accent);
        transform: scaleY(1.35);
      }

      .tabs {
        display: flex;
        gap: 5px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 10px 17px;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        font-size: 14px;
        user-select: none;
        transition:
          color 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .tab:hover {
        color: var(--text);
        transform: translateY(-1px);
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }

      .toolbar {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
      }
      input,
      select {
        font: inherit;
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 11px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      input[type="text"] {
        min-width: 210px;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 9px;
        height: 110px;
        padding: 6px 0;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        height: 100%;
        justify-content: flex-end;
      }
      .bar {
        width: 100%;
        max-width: 56px;
        background: var(--bar-grad);
        border-radius: 5px 5px 0 0;
        min-height: 3px;
        transition:
          height 0.42s cubic-bezier(0.2, 0.9, 0.25, 1),
          filter 0.2s,
          box-shadow 0.2s;
      }
      .bar-col:hover .bar {
        filter: brightness(1.25) saturate(1.15);
        box-shadow: 0 0 14px -2px var(--accent);
      }
      .bar-day {
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        transition: color 0.2s;
      }
      .bar-col:hover .bar-day {
        color: var(--accent);
      }
      .bar-num {
        font-size: 12px;
        font-weight: 600;
        transition: color 0.2s;
      }
      .bar-col:hover .bar-num {
        color: var(--accent);
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 13px;
        font-size: 12px;
        color: var(--muted);
        transition:
          transform 0.18s,
          border-color 0.18s,
          color 0.18s,
          box-shadow 0.18s;
      }
      .chip:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
        color: var(--text);
        box-shadow: var(--glow-soft);
      }
      .chip b {
        color: var(--text);
        font-weight: 600;
        transition: color 0.18s;
      }
      .chip:hover b {
        color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        padding: 9px 11px;
        text-align: left;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
        white-space: nowrap;
        position: sticky;
        top: 0;
        background: var(--panel);
      }
      tbody tr:hover {
        background: var(--hover);
      }
      tbody tr {
        transition: background 0.15s;
      }
      tr.clickable {
        cursor: pointer;
      }
      .table-scroll {
        max-height: 560px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .trunc {
        max-width: 440px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* 群名称单元格：名字可能较长，超长省略，完整 openid 在悬停提示里 */
      .group-cell {
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 11px;
        background: var(--badge-bg);
        color: var(--badge-fg);
        white-space: nowrap;
        transition: transform 0.18s;
      }
      tr.clickable:hover .badge,
      tr:hover .badge {
        transform: scale(1.06);
      }
      .badge.full {
        background: var(--badge-full-bg);
        color: var(--badge-full-fg);
      }
      .badge.at {
        background: var(--badge-at-bg);
        color: var(--badge-at-fg);
      }
      .detail {
        background: var(--detail-bg);
      }
      .detail pre {
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--detail-text);
        margin: 3px 0;
      }
      .detail .k {
        color: var(--muted);
      }

      #logbox {
        background: var(--log-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        height: 600px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      #logbox:hover {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
        box-shadow: inset 0 0 22px -14px var(--accent), var(--glow-soft);
      }
      .logline {
        white-space: pre-wrap;
        word-break: break-all;
        padding: 1.5px 0;
        line-height: 1.55;
        border-radius: 4px;
        transition: background 0.2s;
      }
      .logline:hover {
        background: var(--hover);
      }
      .logline .t {
        color: var(--log-t);
        margin-right: 9px;
      }
      .logline.error {
        color: var(--red);
      }
      .logline.warn {
        color: var(--yellow);
      }
      .logline.ok {
        color: var(--green);
      }
      .logline.sys {
        color: var(--accent);
      }
      .logline.hit {
        background: var(--hit);
      }

      .pager {
        display: flex;
        gap: 9px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 13px;
        color: var(--muted);
        font-size: 13px;
      }
      .empty {
        padding: 34px;
        text-align: center;
        color: var(--muted);
      }
      .spin {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {

      a {

      }

      /* 主题切换按钮组 */
      .themeSwitch {
        display: inline-flex;
        background: var(--panel);
        border: 1px solid var(--border);

      .themeSwitch button {
        border: none;

      .themeSwitch button:hover {

      .themeSwitch button.active {

      /* 事件类型 */
      .panel h2 small {

      /* ============================ 无障碍 ============================
         系统里开了"减少动态效果"就整体关掉动画，只保留颜色变化。 */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
        .card:hover,
        .chip:hover,
        .tab:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // 尽早应用主题，避免打开瞬间闪白/闪黑
      (function () {
        try {
          var saved = localStorage.getItem("qqbot-theme") || "system";
          var dark =
            saved === "dark" ||
            (saved === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");

      })();
    </script>
    <div class="wrap">

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const state = {
        lastSeq: 0,
        logAuto: true,
        msgAuto: false,
        msgOffset: 0,
        msgLimit: 50,
        rawOffset: 0,
        rawLimit: 50,
        busy: false,
        statusBusy: false,
        revealed: false,
        starting: false,
        quitting: false,
        watchdog: false,
        expanded: new Set(),
        // 群名缓存：openid -> 群名（数据库里没存群名，靠 /api/group_names 补）
        groupNames: {},
        groupNameTried: new Set(),
        sig: undefined,
      };

      // 事件类型：中文名 + 简短说明
      const EVENT_INFO = {
        GROUP_MESSAGE_CREATE: {
          name: "群聊·全量消息",
          expl: "群内每条消息都推送（开了全量模式）",
        },
        GROUP_AT_MESSAGE_CREATE: {
          name: "群聊·@机器人",
          expl: "只有 @ 机器人的消息",
        },
        C2C_MESSAGE_CREATE: { name: "单聊消息", expl: "用户私聊机器人" },
        GROUP_MEMBER_ADD: { name: "群成员加入", expl: "有成员进群" },
        GROUP_MEMBER_QUIT: { name: "群成员退出", expl: "有成员退群" },
        GROUP_ADD_ROBOT: { name: "机器人入群", expl: "机器人被拉进群" },
        GROUP_DEL_ROBOT: { name: "机器人退群", expl: "机器人被移出群" },
        GROUP_MSG_REJECT: { name: "群消息被拒", expl: "消息被平台拒绝" },
        GROUP_MSG_RECEIVE: { name: "群消息可接收", expl: "主动消息额度恢复" },
        GROUP_JOIN_REQUEST: { name: "加群申请", expl: "有人申请加群" },
        INTERACTION_CREATE: { name: "按钮交互", expl: "用户点击了消息按钮" },
        FRIEND_ADD: { name: "好友添加", expl: "用户添加机器人好友" },
        FRIEND_DEL: { name: "好友删除", expl: "用户删除机器人好友" },
        READY: { name: "网关就绪", expl: "连接建立成功" },
        RESUMED: { name: "重连成功", expl: "断线后恢复会话" },
      };
      function eventInfo(type) {
        if (EVENT_INFO[type]) return EVENT_INFO[type];
        // 兜底：按前缀猜测
        if (type.includes("GROUP") && type.includes("AT"))
          return { name: "群聊·@机器人", expl: "群内 @ 机器人的消息" };
        if (type.includes("GROUP"))
          return { name: "群聊事件", expl: "群相关事件" };
        if (type.includes("C2C"))
          return { name: "单聊消息", expl: "用户私聊机器人" };
        return { name: type, expl: "未收录的事件类型" };
      }

      // ---------------------------------------------------------- 工具函数
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function fmtBytes(n) {
        if (n == null) return "–";
        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
        return (n / 1024 / 1024).toFixed(2) + " MB";
      }
      function fmtDuration(sec) {
        if (sec == null) return "";
        const h = Math.floor(sec / 3600),
          m = Math.floor((sec % 3600) / 60),
          s = sec % 60;
        if (h) return `${h} 小时 ${m} 分`;
        if (m) return `${m} 分 ${s} 秒`;
        return `${s} 秒`;
      }
      function shortGroup(g) {
        if (!g) return "–";
        return g.length > 10 ? g.slice(0, 6) + "…" + g.slice(-3) : g;
      }

      // ---------------------------------------------------------- 数据库字段注释
      // 「数据库」页的表头直接用列名，这里给常见字段补上中文说明，
      // 表头显示成"中文名 (列名)"，鼠标悬停还能看到英文列名。
      const COLUMN_INFO = {
        // --- 消息表 group_messages ---
        msg_id: "消息 ID",
        group_openid: "群 openid（群标识）",
        sender_openid: "发送者 openid（用户标识）",
        sender_name: "发送者昵称",
        member_role: "成员身份（owner/admin/member）",
        content: "消息正文",
        timestamp: "消息时间（平台给的）",
        attachments: "附件列表（JSON）",
        mentions: "被 @ 的用户列表（JSON）",
        created_at: "入库时间（本机写入）",
        message_type: "消息类型编号（0 文本 / 1 图文等）",
        event_type: "事件类型（GROUP_MESSAGE_CREATE 等）",
        // --- 可能出现的其他字段 ---
        id: "主键 ID",
        rowid: "行号（SQLite 内部）",
        name: "名称",
        count: "数量",
        key: "键",
        value: "值",
        updated_at: "更新时间",
        user_openid: "用户 openid",
        username: "用户名",
        role: "角色",
        status: "状态",
        enabled: "是否启用",
        note: "备注",
        url: "链接",
        path: "路径",
        size: "大小（字节）",
      };
      function colLabel(col) {
        const zh = COLUMN_INFO[col];
        return zh ? `${zh} (${col})` : col;
      }
      async function getJSON(url) {
        const r = await fetch(url, { cache: "no-store" });
        const data = await r
          .json()
          .catch(() => ({ error: "返回内容不是 JSON" }));
        if (!r.ok)
          throw new Error(data && data.error ? data.error : "HTTP " + r.status);
        return data;
      }
      function banner(msg, kind) {
        const b = $("banner");
        if (!msg) {
          b.className = "banner";
          b.textContent = "";
          return;
        }
        b.className = "banner " + (kind || "err");
        b.textContent = msg;
        if (kind === "ok")
          setTimeout(() => {
            b.className = "banner";
          }, 4000);
      }

      // ---------------------------------------------------------- 动效小工具
      // 说明：轮询是每 1 秒一次，所以这里刻意做到"只有真的变了才播动画"，
      // 否则页面会一直闪。所有动画都靠重挂 class 触发（先删再强制回流再加）。

      function replay(el, cls, dur) {
        if (!el || !el.classList) return;
        if (prefersReducedMotion()) return;
        el.classList.remove(cls);
        void el.offsetWidth; // 强制重排，让动画能重新播放
        el.classList.add(cls);
        clearTimeout(el["__t_" + cls]);
        el["__t_" + cls] = setTimeout(() => el.classList.remove(cls), dur);
      }

      let _reduceMotion = null;
      function prefersReducedMotion() {
        if (_reduceMotion === null) {
          try {
            _reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)")
              .matches;
          } catch (e) {
            _reduceMotion = false;
          }
        }
        return _reduceMotion;
      }

      // 表格行 / 日志行的入场：先加 new，动画放完就把 class 摘掉
      function markNew(el, dur) {
        if (!el) return;
        el.classList.add("new");
        setTimeout(() => el.classList.remove("new"), dur || 480);
      }

      // 给列表里的每一项按顺序加个小延迟，做出"依次出现"的效果
      // 延迟在动画结束后会被清掉，否则 transform 会一直带着延迟，悬停会变慢
      function stagger(scope, sel, step) {
        if (!scope || prefersReducedMotion()) return;
        const items = scope.querySelectorAll(sel);
        if (!items.length) return;
        if (scope.querySelector(sel + ".stagger")) return;
        const gap = step || 55;
        const total = 420;
        items.forEach((el, i) => {
          const delay = Math.min(i * gap, 520);
          el.style.animationDelay = delay + "ms";
          el.classList.add("stagger");
          clearTimeout(el.__staggerT);
          el.__staggerT = setTimeout(
            () => {
              el.classList.remove("stagger");
              el.style.animationDelay = "";
            },
            total + delay,
          );
        });
      }

      // 带数字滚动的计数动画
      function animateCount(el, to, fmt) {
        if (!el) return;
        const from = Number(el.__v);
        el.__v = to; // 新的基准值
        const done = (v) => {
          el.textContent = fmt ? fmt(v) : String(v);
        };
        if (prefersReducedMotion() || !isFinite(from) || from === to) {
          done(to);
          return;
        }
        const dur = 460;
        const t0 = performance.now();
        const step = (now) => {
          const p = Math.min(1, (now - t0) / dur);
          const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
          done(Math.round(from + (to - from) * e));
          if (p < 1 && el.__v === to) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      // 数值变化：更新文本 + 跳一下 + 给容器一圈泛光
      function applyCount(id, to, fmt) {
        const el = $(id);
        if (!el) return;
        const changed = el.__v !== to;
        animateCount(el, to, fmt);
        if (changed) {
          replay(el, "pop", 520);
          replay(el.closest(".card"), "flash", 640);
        }
      }

      // 给行数据算个"指纹"，指纹没变就不重绘，避免打断动画
      function rowsKey(rows, cols) {
        return rows
          .map((r) => cols.map((c) => String(r[c] == null ? "" : r[c])).join("\u0001"))
          .join("\u0002");
      }

      // 重绘表格：只给"新出现"的行播放入场动画，已存在的行原样保留
      // 返回新行的 id 集合（Set）
      function renderRows(el, rows, cols, rowHTML, emptyHTML) {
        if (!el) return new Set();
        const key = rowsKey(rows, cols);
        if (el.__key === key) return new Set();
        const oldIds = el.__ids || new Set();
        const added = new Set();
        el.__key = key;
        el.__ids = new Set(rows.map((r) => String(r.msg_id ?? r.rowid ?? "")));
        el.innerHTML = rows.length ? rows.map(rowHTML).join("") : emptyHTML;
        if (oldIds.size) {
          el.querySelectorAll("tr").forEach((tr) => {
            const v = tr.dataset.id;
            if (v != null && !oldIds.has(v)) added.add(v);
          });
        }
        return added;
      }

      // ---------------------------------------------------------- 主题切换
      const THEME_KEY = "qqbot-theme";
      function preferredDark(mode) {
        return (
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        );
      }
      function applyTheme(mode) {
        document.documentElement.setAttribute(
          "data-theme",
          preferredDark(mode) ? "dark" : "light",
        );
        document.querySelectorAll("#themeSwitch button").forEach((b) => {
          b.classList.toggle("active", b.dataset.themeOpt === mode);
        });
      }
      function setTheme(mode) {
        try {
          localStorage.setItem(THEME_KEY, mode);
        } catch (e) {}
        applyTheme(mode);
      }
      document.querySelectorAll("#themeSwitch button").forEach((btn) => {
        btn.onclick = () => setTheme(btn.dataset.themeOpt);
      });
      // 跟随系统时，系统切换配色要实时生效
      try {
        window
          .matchMedia("(prefers-color-scheme: dark)")
          .addEventListener("change", () => {
            let mode = "system";
            try {
              mode = localStorage.getItem(THEME_KEY) || "system";
            } catch (e) {}
            if (mode === "system") applyTheme(mode);
          });
      } catch (e) {}
      // 初始化按钮选中状态
      (function () {
        let mode = "system";
        try {
          mode = localStorage.getItem(THEME_KEY) || "system";
        } catch (e) {}
        applyTheme(mode);
      })();

      // ---------------------------------------------------------- 打开方式检测
      // 如果用户直接双击 index.html（file:// 协议），浏览器会禁止它访问本机服务，
      // 这里给出明确提示，而不是让人看到一堆"控制台连接失败"。
      const IS_FILE_MODE = location.protocol === "file:";
      let connWarned = false;

      // ---------------------------------------------------------- 标签页
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.onclick = () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".view")
            .forEach((v) => v.classList.remove("active"));
          tab.classList.add("active");
          const view = $("view-" + tab.dataset.view);
          view.classList.add("active");
          animateView(view);
          if (tab.dataset.view === "messages") loadMessages();
          if (tab.dataset.view === "logs") loadLogs();
          if (tab.dataset.view === "raw") loadRaw();
        };
      });

      // 打开某个标签页时，让里面的卡片 / 面板依次浮起来
      function animateView(view) {
        stagger(view, ".card, .panel", 60);
      }

      // ---------------------------------------------------------- 状态
      // 状态点：运行状态真的变化时才扩散一圈（否则每秒闪一下太吵）
      function setDot(cls) {
        const dot = $("dot");
        if (!dot) return;
        const changed = dot.dataset.state !== cls;
        dot.dataset.state = cls;
        dot.classList.remove("on", "off", "busy");
        dot.classList.add(cls);
        if (changed && dot.__ready) replay(dot, "ripple", 720);
        dot.__ready = true;
      }

      // ---------------------------------------------------------- 群名
      // 数据库里只有 group_openid（平台不下发群名），所以：
      //   1. 先看本地缓存 / 服务端按需查询回来的真实群名；
      //   2. 查不到就显示"群 + openid 尾号"，完整 openid 放在悬停提示里。
      let groupLastQuery = 0;

      function shortId(id) {
        if (!id) return "–";
        const s = String(id);
        return s.length <= 8 ? s : s.slice(-6);
      }

      function groupLabel(gid) {
        if (!gid) return "–";
        const name = state.groupNames && state.groupNames[gid];
        return name ? name : "群 " + shortId(gid);
      }

      function groupTip(gid) {
        if (!gid) return "";
        const name = state.groupNames && state.groupNames[gid];
        return (name ? name + "\n" : "") + "群 openid：" + gid;
      }

      // 把表格里的群单元格补上群名（只在拿到新名字时才改写）
      function fillGroupCells() {
        document.querySelectorAll("#mBody [data-gid]").forEach((td) => {
          const gid = td.dataset.gid;
          const label = groupLabel(gid);
          if (td.textContent !== label) td.textContent = label;
          td.title = groupTip(gid);
        });
      }

      // 按需问一次服务端（服务端有缓存，查不到的群名会返回 null）
      async function loadGroupNames(ids, force) {
        if (!ids.length) return;
        try {
          const q =
            "/api/group_names?ids=" +
            encodeURIComponent(ids.join(",")) +
            (force ? "&refresh=1" : "");
          const r = await getJSON(q);
          let got = 0;
          Object.keys(r.names || {}).forEach((gid) => {
            const name = r.names[gid];
            if (name) {
              state.groupNames[gid] = name;
              got++;
            }
          });
          fillGroupCells();
          if (r.error) banner(r.error, "ok");
          return got;
        } catch (e) {
          if (force) banner("查询群名失败：" + e.message);
          return 0;
        }
      }

      // 表格渲染完后调用：给还没名字的群批量查一次，10 秒内不重复查
      function requestGroupNames(gids) {
        const unknown = [];
        new Set(gids.filter(Boolean)).forEach((gid) => {
          if (!state.groupNames[gid] && !state.groupNameTried.has(gid)) {
            state.groupNameTried.add(gid);
            unknown.push(gid);
          }
        });
        if (!unknown.length) return;
        if (Date.now() - groupLastQuery < 10000) return;
        groupLastQuery = Date.now();
        loadGroupNames(unknown, false);
      }

      async function refreshStatus() {
        if (state.statusBusy) return; // 1 秒一次，避免上一次还没回来又发一次
        state.statusBusy = true;
        try {
          const s = await getJSON("/api/status");

          // 启动阶段的判定：进程起来了但还没连上网关
          const starting = s.running && !s.ready;
          if (s.ready || !s.running) state.starting = false;

          if (s.running) {
            setDot(starting ? "busy" : "on");
            setText("statusText", starting ? "启动中…" : "运行中");
            $("uptime").textContent = starting
              ? "PID " + s.pid + " · 正在连接 QQ 网关"
              : "PID " +
                s.pid +
                " · 已运行 " +
                fmtDuration(s.uptime_seconds) +
                " · 启动于 " +
                (s.started_at || "–");
          } else {
            setDot("off");
            setText("statusText", s.phase === "failed" ? "启动失败" : "已停止");
            $("uptime").textContent =
              s.phase === "failed"
                ? "进程退出了，请到「运行日志」看报错"
                : s.last_exit_code != null
                  ? "上次退出码 " + s.last_exit_code
                  : "尚未启动过";
          }
          // 控制台时间每秒都在变，这里不播动画，避免一直闪
          setText("serverTime", "控制台时间 " + s.server_time, {
            animate: false,
          });
          if (s.watchdog) setWatchdog($("btnWatchdog"), s.watchdog.enabled);
          $("btnStart").disabled = s.running;
          $("btnStop").disabled = !s.running;
          $("btnRestart").disabled = state.busy;

          const st = s.stats || {};
          if (st.error) {
            banner("读取数据库失败：" + st.error);
          }

          // 顶部扫光：**只有数据真的变了才闪一下**。
          // 之前是无条件每秒播一次，看起来就像顶部有段东西一直在循环，
          // 所以这里改成比对"关键数据指纹"。
          const sig = [
            s.running,
            s.ready,
            st.total,
            st.today,
            st.senders,
            st.groups,
            st.db_size,
            st.latest ? st.latest.time : "",
          ].join("|");
          if (state.sig === undefined) {
            state.sig = sig; // 首屏不算变化
          } else if (state.sig !== sig) {
            state.sig = sig;
            if (!document.hidden)
              replay(document.querySelector(".wrap"), "sweep", 800);
          }

          // 数字变化会滚动过去，并给卡片一圈泛光
          applyCount("cTotal", st.total ?? "–");
          applyCount("cToday", st.today ?? "–");
          applyCount("cSenders", st.senders ?? "–");
          applyCount("cGroups", st.groups ?? "–");
          applyCount("cDbSize", st.db_size, fmtBytes);

          renderBars(st.daily || []);
          renderEvents(st.by_event || []);

          // 第一次拿到数据后，让整页浮起来一次
          if (!state.revealed) {
            state.revealed = true;
            stagger(document.body, ".card, .panel", 60);
          }
        } catch (e) {
          state.busy = false;
          state.starting = false;
          setDot("off");
          setText("statusText", "控制台连接失败");
          if (!connWarned) {
            connWarned = true;
            if (IS_FILE_MODE) {
              banner(
                "你现在是直接打开网页文件（file://），浏览器不允许它访问本机服务。" +
                  "请改为双击 qqbot-backend 文件夹里的 console.bat 启动服务，" +
                  "再访问它打开的 http://127.0.0.1:8730",
              );
            } else {
              banner(
                "连不上本地服务。请确认 console.bat 那个黑窗口还开着（关掉它服务就停了）。",
              );
            }
          }
        } finally {
          state.statusBusy = false;
        }
      }

      // 文本变了才写；animate=false 用于每秒都在变的字段（如控制台时间），
      // 这类字段只更新文字，不做闪烁动画。
      function setText(id, text, opts) {
        const el = $(id);
        if (!el || el.textContent === text) return;
        el.textContent = text;
        if (!opts || opts.animate !== false) replay(el, "tick", 360);
      }

      // 7 天柱状图：图表结构只建一次，之后只改高度，这样高度变化是平滑过渡的
      function renderBars(daily) {
        const box = $("bars");
        if (!box) return;
        const key = daily.map((d) => d.date + ":" + d.count).join("|");
        if (box.__key === key) return;
        const rebuilt = box.__key === undefined;
        box.__key = key;

        if (!daily.length) {
          box.innerHTML = '<div class="empty">暂无数据</div>';
          return;
        }
        const max = Math.max(1, ...daily.map((d) => d.count));

        if (rebuilt) {
          box.innerHTML = daily
            .map((d) => {
              const h = Math.round((d.count / max) * 88);
              return `<div class="bar-col" title="${esc(d.date)}: ${d.count} 条">
        <div class="bar-num">${d.count}</div>
        <div class="bar" style="height:${d.count ? Math.max(h, 3) : 2}px"></div>
        <div class="bar-day">${esc(d.date.slice(5))}</div>
      </div>`;
            })
            .join("");
          box.querySelectorAll(".bar").forEach((b) => replay(b, "rise", 460));
        } else {
          const cols = Array.from(box.querySelectorAll(".bar-col"));
          if (cols.length !== daily.length) {
            box.__key = undefined;
            renderBars(daily);
            return;
          }
          daily.forEach((d, i) => {
            const h = Math.round((d.count / max) * 88);
            const num = cols[i].querySelector(".bar-num");
            const bar = cols[i].querySelector(".bar");
            cols[i].title = `${d.date}: ${d.count} 条`;
            if (num && num.textContent !== String(d.count)) {
              num.textContent = d.count;
              replay(num, "pop", 520);
            }
            if (bar) bar.style.height = (d.count ? Math.max(h, 3) : 2) + "px";
          });
        }
      }

      // 事件类型：容器里只显示中文类型名，具体说明放在悬停提示里
      function renderEvents(ev) {
        const box = $("eventChips");
        if (!box) return;
        const key = ev.map((e) => e.event_type + ":" + e.count).join("|");
        if (box.__key === key) return;
        box.__key = key;
        box.innerHTML = ev.length
          ? ev
              .map((e) => {
                const info = eventInfo(e.event_type);
                const tip = `${e.event_type}\n${info.expl}`;
                return `<span class="chip" title="${esc(tip)}">${esc(info.name)} <b>${e.count}</b></span>`;
              })
              .join("")
          : '<span class="chip">暂无数据</span>';
        stagger(box, ".chip", 40);
      }

      // ---------------------------------------------------------- 控制按钮
      async function control(action, label) {
        if (state.busy) return;
        state.busy = true;
        setDot("busy");
        setText("statusText", label + "中…");
        ["btnStart", "btnStop", "btnRestart"].forEach(
          (id) => ($(id).disabled = true),
        );
        try {
          const r = await getJSON("/api/" + action);
          if (r.ok) {
            if (action === "stop") {
              banner("已停止", "ok");
            } else {
              state.starting = true;
              banner("进程已拉起，正在连接网关…", "ok");
              // 30 秒内没就绪就提示去看日志
              setTimeout(() => {
                if (state.starting) {
                  state.starting = false;
                  banner(
                    "启动超时，进程可能没连上网关，请到「运行日志」查看报错。",
                  );
                }
              }, 30000);
            }
          } else {
            banner(label + "失败：" + (r.error || "未知错误"));
          }
        } catch (e) {
          banner(label + "失败：" + e.message);
        }
        state.busy = false;
        await refreshStatus();
        if (action !== "stop") setTimeout(loadLogs, 400);
      }
      $("btnStart").onclick = () => control("start", "启动");
      $("btnStop").onclick = () => control("stop", "停止");
      $("btnRestart").onclick = () => control("restart", "重启");

      // 退出控制台：先停机器人，再关掉本地服务，最后把网页一起关掉
      $("btnQuit").onclick = async () => {
        if (
          !confirm(
            "确定要退出控制台吗？\n\n机器人会被停止，控制台服务也会关闭，本网页将自动关闭。\n下次使用需要重新双击 cicada 文件夹里的 start.bat。",
          )
        )
          return;
        state.quitting = true;
        $("btnQuit").disabled = true;
        banner("正在退出控制台……", "ok");
        try {
          await getJSON("/api/shutdown");
        } catch (e) {
          /* 服务已关，请求断开是正常的 */
        }
        document.body.innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;' +
          'height:100vh;flex-direction:column;gap:14px;text-align:center;padding:24px">' +
          '<div style="font-size:22px">控制台已退出</div>' +
          '<div style="color:var(--muted)">机器人已停止，本页面会自动关闭。<br>' +
          "如果它没有自动关掉，请手动关闭这个标签页。</div>" +
          "</div>";
        // 尝试自动关闭标签页
        setTimeout(() => {
          try {
            window.close();
          } catch (e) {}
          try {
            window.open("", "_self");
            window.close();
          } catch (e) {}
        }, 400);
      };

      // 关网页后自动停止控制台（心跳看门狗）
      // 按钮只在这里改文字和颜色；refreshStatus 每秒调一次，值没变就什么都不做，
      // 否则文字每秒被重写，鼠标根本选不中。
      function setWatchdog(btn, enabled) {
        const on = !!enabled;
        if (state.watchdog !== on) replay(btn, "flash", 640);
        state.watchdog = on;
        const text = "关网页后自动停止：" + (on ? "开" : "关");
        if (btn.textContent !== text) btn.textContent = text;
        btn.style.color = on ? "var(--green)" : "";
      }
      $("btnWatchdog").onclick = async () => {
        const next = !state.watchdog;
        try {
          const r = await getJSON(
            "/api/watchdog?enabled=" + (next ? "1" : "0"),
          );
          setWatchdog($("btnWatchdog"), r.enabled);
          banner(
            r.enabled
              ? "已开启：关掉网页约 " +
                  Math.round(r.timeout) +
                  " 秒后，机器人会自动停止"
              : "已关闭：关掉网页后机器人继续运行",
            "ok",
          );
        } catch (e) {
          banner("设置失败：" + e.message);
        }
      };

      // ---------------------------------------------------------- 日志
      function logClass(text) {
        if (/\b(ERROR|CRITICAL)\b/.test(text) || /异常|失败|错误/.test(text))
          return "error";
        if (/\bWARNING\b/.test(text) || /警告/.test(text)) return "warn";
        if (/收到网关事件|已入库|已上线|启动成功/.test(text)) return "ok";
        if (/\[控制台\]/.test(text)) return "sys";
        return "";
      }
      async function loadLogs() {
        try {
          const d = await getJSON("/api/logs?after=" + state.lastSeq);
          const box = $("logbox");
          const atBottom =
            box.scrollHeight - box.scrollTop - box.clientHeight < 60;
          const filter = $("lFilter").value.trim();
          let added = 0;

          for (const line of d.lines) {
            state.lastSeq = Math.max(state.lastSeq, line.seq);
            const div = document.createElement("div");
            div.className = "logline " + logClass(line.text);
            div.dataset.text = line.text;
            div.innerHTML = `<span class="t">${esc(line.ts)}</span>${esc(line.text)}`;
            if (filter && !line.text.includes(filter))
              div.style.display = "none";
            box.appendChild(div);
            // 新行滑进来（已在页面上时用户滚动查看历史，不会被打断）
            if (added < 60) markNew(div);
            added++;
          }
          // 控制 DOM 体积
          while (box.childElementCount > 3000) box.removeChild(box.firstChild);
          if (added) $("lCount").textContent = box.childElementCount + " 行";
          if (atBottom && state.logAuto) box.scrollTop = box.scrollHeight;
        } catch (e) {
          /* 日志接口失败时静默，避免刷屏 */
        }
      }
      $("lAuto").onclick = () => {
        state.logAuto = !state.logAuto;
        $("lAuto").textContent = "自动刷新：" + (state.logAuto ? "开" : "关");
      };
      $("lBottom").onclick = () => {
        const box = $("logbox");
        box.scrollTop = box.scrollHeight;
      };
      $("lClear").onclick = async () => {
        await getJSON("/api/logs/clear");
        $("logbox").innerHTML = "";
        state.lastSeq = 0;
        $("lCount").textContent = "0 行";
      };
      $("lFilter").oninput = () => {
        const raw = $("lFilter").value.trim();
        const low = raw.toLowerCase();
        document.querySelectorAll("#logbox .logline").forEach((el) => {
          const t = el.dataset.text || "";
          const hit = !raw || t.includes(raw) || t.toLowerCase().includes(low);
          el.style.display = hit ? "" : "none";
          el.classList.toggle("highlight", !!raw && hit);
        });
      };

      // ---------------------------------------------------------- 消息记录
      function msgRow(r) {
        const isAt = (r.event_type || "").includes("AT");
        const badge = `<span class="badge ${isAt ? "at" : "full"}">${isAt ? "@" : "全量"}</span>`;
        const counts = [];
        if (r.attachment_count) counts.push("附件 " + r.attachment_count);
        if (r.mention_count) counts.push("@" + r.mention_count);
        const open = state.expanded.has(r.msg_id);
        let html = `<tr class="clickable" data-id="${esc(r.msg_id)}">
    <td class="mono">${esc(r.timestamp || r.created_at || "–")}</td>
    <td>${badge}</td>
    <td>${esc(r.sender_name || "–")}</td>
    <td class="trunc" title="${esc(r.content)}">${esc(r.content || "")}</td>
    <td class="group-cell" data-gid="${esc(r.group_openid)}" title="${esc(groupTip(r.group_openid))}">${esc(groupLabel(r.group_openid))}</td>
    <td class="muted">${counts.join(" · ") || "–"}</td>
  </tr>`;
        if (open) {
          html += `<tr class="detail"><td colspan="6">
      <pre><span class="k">msg_id  :</span> ${esc(r.msg_id)}</pre>
      <pre><span class="k">群名称   :</span> ${esc(groupLabel(r.group_openid))}</pre>
      <pre><span class="k">群 openid:</span> ${esc(r.group_openid)}</pre>
      <pre><span class="k">发送者   :</span> ${esc(r.sender_name)} (${esc(r.sender_openid)})</pre>
      <pre><span class="k">身份     :</span> ${esc(r.member_role || "–")}</pre>
      <pre><span class="k">事件类型 :</span> ${esc(r.event_type || "–")}</pre>
      <pre><span class="k">入库时间 :</span> ${esc(r.created_at)}</pre>
      <pre><span class="k">完整正文 :</span> ${esc(r.content)}</pre>
      <pre><span class="k">附件     :</span> ${esc(r.attachments)}</pre>
      <pre><span class="k">@列表    :</span> ${esc(r.mentions)}</pre>
    </td></tr>`;
        }
        return html;
      }
      async function loadMessages() {
        const q = new URLSearchParams({
          keyword: $("mKeyword").value.trim(),
          group: $("mGroup").value,
          order: $("mOrder").value,
          limit: state.msgLimit,
          offset: state.msgOffset,
        });
        try {
          const d = await getJSON("/api/messages?" + q);
          const gids = (d.groups || []).map((g) => g.group_openid).filter(Boolean);

          // 先在后台问一次群名（有缓存就秒回，命令式加载不会卡住列表）
          requestGroupNames(gids);

          // 群下拉：显示群名（拿不到就显示"群 尾号"），悬停能看到完整 openid
          const sel = $("mGroup"),
            cur = sel.value;
          sel.innerHTML =
            '<option value="">全部群</option>' +
            (d.groups || [])
              .map(
                (g) =>
                  `<option value="${esc(g.group_openid)}" data-count="${esc(g.count)}" title="${esc(groupTip(g.group_openid))}">${esc(groupLabel(g.group_openid))} (${g.count})</option>`,
              )
              .join("");
          sel.value = cur;

          // 只有内容真的变了才重建表格；新出现的行会滑进来
          const added = renderRows(
            $("mBody"),
            d.rows,
            ["msg_id", "timestamp", "created_at", "content", "sender_name", "attachment_count", "mention_count"],
            msgRow,
            '<tr><td colspan="6" class="empty">没有匹配的消息</td></tr>',
          );
          fillGroupCells();
          $("mBody")
            .querySelectorAll("tr.clickable")
            .forEach((tr) => {
              if (added.size && added.has(tr.dataset.id)) markNew(tr);
              tr.onclick = () => {
                const id = tr.dataset.id;
                state.expanded.has(id)
                  ? state.expanded.delete(id)
                  : state.expanded.add(id);
                loadMessages();
              };
            });

          const from = d.total ? state.msgOffset + 1 : 0;
          const to = Math.min(state.msgOffset + state.msgLimit, d.total);
          setText("mPageInfo", `第 ${from}–${to} 条 / 共 ${d.total} 条`);
          $("mPrev").disabled = state.msgOffset <= 0;
          $("mNext").disabled = to >= d.total;
        } catch (e) {
          banner("读取消息失败：" + e.message);
        }
      }
      $("mKeyword").oninput = debounce(() => {
        state.msgOffset = 0;
        loadMessages();
      }, 350);
      $("mGroup").onchange = () => {
        state.msgOffset = 0;
        loadMessages();
      };
      $("mOrder").onchange = () => {
        state.msgOffset = 0;
        loadMessages();
      };
      $("mLimit").onchange = () => {
        state.msgLimit = +$("mLimit").value;
        state.msgOffset = 0;
        loadMessages();
      };
      $("mRefresh").onclick = () => loadMessages();
      $("mPrev").onclick = () => {
        state.msgOffset = Math.max(0, state.msgOffset - state.msgLimit);
        loadMessages();
      };
      $("mNext").onclick = () => {
        state.msgOffset += state.msgLimit;
        loadMessages();
      };
      $("mAuto").onclick = () => {
        state.msgAuto = !state.msgAuto;
        $("mAuto").textContent = "自动刷新：" + (state.msgAuto ? "开" : "关");
      };
      // 主动向平台查一次群名（数据库里没有群名，只能按需查）
      $("mGroupNames").onclick = async () => {
        const btn = $("mGroupNames");
        const ids = Array.from($("mGroup").options)
          .map((o) => o.value)
          .filter(Boolean);
        if (!ids.length) {
          banner("还没有可查询的群", "ok");
          return;
        }
        btn.disabled = true;
        btn.textContent = "查询中…";
        const got = await loadGroupNames(ids, true);
        btn.disabled = false;
        btn.textContent = "获取群名";
        if (got) {
          state.groupNameTried = new Set(Object.keys(state.groupNames));
          const sel = $("mGroup"),
            cur = sel.value;
          Array.from(sel.options).forEach((o) => {
            if (!o.value) return;
            o.textContent =
              groupLabel(o.value) + " (" + (o.dataset.count || "0") + ")";
            o.title = groupTip(o.value);
          });
          sel.value = cur;
          banner("已获取 " + got + " 个群名", "ok");
        } else {
          banner(
            "没查到群名，先显示 openid 尾号（机器人可能没有该接口权限）",
            "ok",
          );
        }
      };

      function debounce(fn, ms) {
        let t;
        return (...a) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...a), ms);
        };
      }

      // ---------------------------------------------------------- 数据库
      async function loadRaw() {
        try {
          const meta = await getJSON("/api/tables");
          const sel = $("rTable"),
            cur = sel.value;
          sel.innerHTML =
            (meta.tables || [])
              .map((t) => {
                const c =
                  meta.counts && meta.counts[t] != null
                    ? ` (${meta.counts[t]})`
                    : "";
                return `<option value="${esc(t)}">${esc(t)}${c}</option>`;
              })
              .join("") || '<option value="">（没有表）</option>';
          if (cur && (meta.tables || []).includes(cur)) sel.value = cur;

          const table = sel.value;
          if (!table) {
            $("rHead").innerHTML = "";
            $("rBody").innerHTML =
              '<tr><td class="empty">数据库里还没有表，先启动一次机器人</td></tr>';
            return;
          }

          const d = await getJSON(
            `/api/table?table=${encodeURIComponent(table)}&limit=${state.rawLimit}&offset=${state.rawOffset}`,
          );
          if (d.error) {
            banner(d.error);
            return;
          }

          const headKey = d.columns.join("|");
          if ($("rHead").__key !== headKey) {
            $("rHead").__key = headKey;
            $("rHead").innerHTML =
              "<tr>" +
              d.columns
                .map(
                  (c) =>
                    `<th title="${esc(c)}">${esc(colLabel(c))}</th>`,
                )
                .join("") +
              "</tr>";
          }
          // 数据没变就不重绘，避免每一秒都把表格重建一遍（那样动画会一直闪）
          const added = renderRows(
            $("rBody"),
            d.rows,
            d.columns,
            (row) =>
              "<tr>" +
              d.columns
                .map((c) => {
                  const v = row[c];
                  if (v === null || v === undefined)
                    return '<td class="muted">NULL</td>';
                  return `<td class="mono trunc" title="${esc(String(v))}">${esc(String(v))}</td>`;
                })
                .join("") +
              "</tr>",
            '<tr><td class="empty">这张表没有数据</td></tr>',
          );
          if (added.size) {
            const first = $("rBody").querySelector("tr");
            if (first) markNew(first);
          }

          const from = d.total ? state.rawOffset + 1 : 0;
          const to = Math.min(state.rawOffset + state.rawLimit, d.total);
          setText("rPageInfo", `第 ${from}–${to} 行 / 共 ${d.total} 行`);
          $("rPrev").disabled = state.rawOffset <= 0;
          $("rNext").disabled = to >= d.total;
        } catch (e) {
          banner("读取数据库失败：" + e.message);
        }
      }
      $("rTable").onchange = () => {
        state.rawOffset = 0;
        loadRaw();
      };
      $("rLimit").onchange = () => {
        state.rawLimit = +$("rLimit").value;
        state.rawOffset = 0;
        loadRaw();
      };
      $("rRefresh").onclick = () => loadRaw();
      $("rPrev").onclick = () => {
        state.rawOffset = Math.max(0, state.rawOffset - state.rawLimit);
        loadRaw();
      };
      $("rNext").onclick = () => {
        state.rawOffset += state.rawLimit;
        loadRaw();
      };

      // ---------------------------------------------------------- 定时轮询
      // 刷新频率：1 秒一次（状态与日志）。refreshStatus 里有 in-flight 判断，
      // 上一次没返回就跳过这一拍，不会把请求堆起来。
      const POLL_MS = 1000;
      refreshStatus();
      loadLogs();
      setInterval(refreshStatus, POLL_MS);
      setInterval(() => {
        // 日志行是流式的，每帧都有新内容，所以独立按 1 秒刷
        if (state.logAuto) loadLogs();
      }, POLL_MS);
      setInterval(() => {
        if (state.msgAuto && $("view-messages").classList.contains("active"))
          loadMessages();
      }, 5000);

      // 心跳：让服务知道网页还开着（关网页后自动停止功能依赖它）
      async function beat() {
        if (state.quitting) return;
        try {
          const r = await getJSON("/api/heartbeat");
          setWatchdog($("btnWatchdog"), r.enabled);
        } catch (e) {
          /* 服务已关就安静退出 */
        }
      }
      beat();
      setInterval(beat, 5000);
      // 页面重新可见时立刻补一次心跳（比如电脑刚睡醒）
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) beat();
      });

      // 直接关网页时提示一下，避免误关
      window.addEventListener("beforeunload", (e) => {
        if (state.quitting) return;
        e.preventDefault();
        e.returnValue = "";
        return "";
      });
    </script>
  </body>
</html>
